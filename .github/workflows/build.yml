name: Build

on:
  push:
  pull_request:

jobs:
  shared-headers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Shared headers are identical in all sketches
        run: |
          cmp cloud-lightning/lightning.h cloud-lightning-esp32/lightning.h
          cmp cloud-lightning/thunder.h cloud-lightning-esp32/thunder.h

  compile:
    name: compile (${{ matrix.name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: arduino BLE
            sketch: cloud-lightning
            fqbn: arduino:avr:uno
          - name: arduino BLE + thunder + rumble
            sketch: cloud-lightning
            fqbn: arduino:avr:uno
            enable: THUNDER RUMBLE
          - name: esp32 standalone
            sketch: cloud-lightning-esp32
            fqbn: esp32:esp32:esp32
            connectivity: NONE
          - name: esp32 WiFi
            sketch: cloud-lightning-esp32
            fqbn: esp32:esp32:esp32
          - name: esp32 WiFi leader, everything
            sketch: cloud-lightning-esp32
            fqbn: esp32:esp32:esp32
            enable: SYNC THUNDER RUMBLE MICROPHONE
          - name: esp32-c3 standalone follower + rumble
            sketch: cloud-lightning-esp32
            fqbn: esp32:esp32:esp32c3
            connectivity: NONE
            enable: SYNC RUMBLE
            config: s|^#define CLOUD_LEADER true.*|#define CLOUD_LEADER false|
          - name: esp32-c3 standalone leader + microphone
            sketch: cloud-lightning-esp32
            fqbn: esp32:esp32:esp32c3
            connectivity: NONE
            enable: SYNC MICROPHONE
          - name: esp32-c6 Zigbee
            sketch: cloud-lightning-esp32
            fqbn: esp32:esp32:esp32c6:ZigbeeMode=zczr,PartitionScheme=zigbee_zczr
            connectivity: ZIGBEE
          - name: esp32-c6 Zigbee leader, everything
            sketch: cloud-lightning-esp32
            fqbn: esp32:esp32:esp32c6:ZigbeeMode=zczr,PartitionScheme=zigbee_zczr
            connectivity: ZIGBEE
            enable: SYNC THUNDER RUMBLE MICROPHONE
    env:
      ARDUINO_BOARD_MANAGER_ADDITIONAL_URLS: https://espressif.github.io/arduino-esp32/package_esp32_index.json
    steps:
      - uses: actions/checkout@v4
      - uses: arduino/setup-arduino-cli@v2
      - name: Install core and libraries
        run: |
          arduino-cli core update-index
          arduino-cli core install ${{ startsWith(matrix.fqbn, 'esp32') && 'esp32:esp32' || 'arduino:avr' }}
          arduino-cli lib install "Adafruit NeoPixel" PubSubClient NimBLE-Arduino
      - name: Configure
        run: |
          cd ${{ matrix.sketch }}
          if [ -f config.example.h ]; then
            cp config.example.h config.h
          fi
          if [ -n "${{ matrix.connectivity }}" ]; then
            sed -i 's|^#define CONNECTIVITY_WIFI|// #define CONNECTIVITY_WIFI|' config.h
            sed -i 's|^// #define CONNECTIVITY_${{ matrix.connectivity }}|#define CONNECTIVITY_${{ matrix.connectivity }}|' config.h
          fi
          for feature in ${{ matrix.enable }}; do
            sed -i "s|^// #define ENABLE_$feature\$|#define ENABLE_$feature|" *.ino *.h
            grep -q "^#define ENABLE_$feature\$" *.ino *.h
          done
          if [ -n "${{ matrix.config }}" ]; then
            sed -i "${{ matrix.config }}" config.h
          fi
          grep -hE '^#define (CONNECTIVITY|ENABLE|CLOUD_LEADER)' *.ino *.h || true
      - name: Compile
        run: arduino-cli compile --fqbn ${{ matrix.fqbn }} --warnings all ${{ matrix.sketch }}
